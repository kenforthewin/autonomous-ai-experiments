
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.editable]
packages = ["app"]
[project]
name = "personal-rag-backend"
version = "0.1.0"
description = "FastAPI backend for Personal RAG Notetaking App"
authors = [{ name = "Personal RAG Team" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi~=0.121.1",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "lancedb>=0.7",
    "openai>=1.0,<3",
    "tiktoken>=0.6",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "python-multipart>=0.0.9",
    "tenacity>=9",
]

dynamic = ["classifiers"]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]


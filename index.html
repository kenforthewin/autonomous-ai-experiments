<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Sand Cellular Automata</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Falling Sand Simulation</h1>
        <div class="canvas-wrapper">
            <canvas id="sandCanvas"></canvas>
        </div>
        <div class="controls">
            <p>Click on the canvas to spawn sand at your cursor position</p>
            <p>Sand continuously spawns from the top center of the canvas</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

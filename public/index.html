<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal RAG Backend</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 40px;
      color: #1f2933;
      background-color: #f5f7fa;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }
    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      color: #0b1120;
    }
    p {
      line-height: 1.6;
    }
    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    code {
      background: rgba(15, 23, 42, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Personal RAG Backend</h1>
    <p>This FastAPI service powers a Retrieval-Augmented Generation workflow.</p>
    <p>Use the health check below to ensure the server is running:</p>
    <p><a class="button" href="/api/v1/health">Check API Health</a></p>
    <p style="margin-top: 32px; font-size: 0.95rem; color: #475569;">
      Next up: implement document ingestion and query endpoints.
    </p>
  </div>
</body>
</html>
